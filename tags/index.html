mino.github.io/"}</script><noscript><style>img[loading] {
                    opacity: 1;
                }</style></noscript><script>(function() {
    function forzarEstilosTattoo() {
      if (window.innerWidth > 991) return;

      // 1. FORZAR ICONO AMARILLO (#E6CA5D)
      // Buscamos cualquier botón o elemento interactivo del menú móvil
      const botones = document.querySelectorAll('header button, .navbar button, [class*="navbar-toggler"], [class*="menu-toggle"], [class*="toggle"], button[aria-label*="Menu"], button[aria-label*="Menú"]');
      
      botones.forEach(btn => {
        btn.style.setProperty("color", "#E6CA5D", "important");
        btn.style.setProperty("fill", "#E6CA5D", "important");
        btn.style.setProperty("stroke", "#E6CA5D", "important");

        // Forzar todos los elementos internos del icono (paths, svgs, líneas, etc.)
        const vectores = btn.querySelectorAll("svg, path, line, polyline, rect, circle, span");
        vectores.forEach(v => {
          v.style.setProperty("color", "#E6CA5D", "important");
          v.style.setProperty("fill", "#E6CA5D", "important");
          v.style.setProperty("stroke", "#E6CA5D", "important");
        });
      });

      // 2. FORZAR FONDO OSCURO (#443f3f) AL MENÚ DESPLEGABLE Y TODAS SUS CAPAS
      // Buscamos contenedores de menús, barras colapsables y listas desplegables
      const paneles = document.querySelectorAll('.navbar-collapse, .navbar__collapse, .nav-collapse, .site-navigation, div[class*="menu"], nav[class*="menu"], div[class*="dropdown"], div[class*="collapse"], ul[class*="menu"], ul[class*="nav"], div[class*="panel"]');
      
      paneles.forEach(panel => {
        panel.style.setProperty("background-color", "#443f3f", "important");
        panel.style.setProperty("background", "#443f3f", "important");
        
        // Forzar también a los hijos directos por si hay capas internas blancas
        const capasInternas = panel.querySelectorAll("div, nav, ul, li");
        capasInternas.forEach(capa => {
          // Solo si tienen fondo blanco o transparente heredado
          const bgActual = window.getComputedStyle(capa).backgroundColor;
          if (bgActual === "rgb(255, 255, 255)" || bgActual === "transparent" || bgActual === "rgba(0, 0, 0, 0)") {
            capa.style.setProperty("background-color", "#443f3f", "important");
            capa.style.setProperty("background", "#443f3f", "important");
          }
        });
      });
    }

    // Ejecutar al cargar la página
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", forzarEstilosTattoo);
    } else {
      forzarEstilosTattoo();
    }

    // Ejecutar tras cualquier interacción o cambio dinámico en la web (MutationObserver)
    const observador = new MutationObserver(function() {
      forzarEstilosTattoo();
    });

    observador.observe(document.body, {
      childList: true,
      subtree: true,
      attributes: true
    });

    // Ejecutar también periódicamente en milisegundos por si Tattoo reescribe elementos tarde
    setInterval(forzarEstilosTattoo, 150);
  })();</script></head><body class="tags-template"><div class="container"><header class="top" id="js-top"><div><a class="logo" href="https://wikamino.github.io/"><img src="https://wikamino.github.io/media/website/WikaminoIV_web_ajustada.png" alt="Wikamino" width="1531" height="796"></a><nav class="navbar"><button class="navbar__toggle" aria-label="Menu" aria-haspopup="true" aria-expanded="false"><span class="navbar__toggle-box"><span class="navbar__toggle-inner">Menu</span></span></button><ul class="navbar__menu"><li><a href="https://wikamino.github.io/wikamino.html" target="_self">Wikamino</a></li><li><a href="https://wikamino.github.io/noticias-3.html" title="noticias" target="_self">Noticias</a></li><li><a href="https://wikamino.github.io/normativa.html" title="normativa" target="_self">Normativa</a></li><li><a href="https://wikamino.github.io/jurisprudencia.html" title="jurisprudencia" target="_self">Jurisprudencia</a></li><li><a href="https://wikamino.github.io/documentacion.html" target="_self">Documentación</a></li><li><a href="https://wikamino.github.io/reportajes.html" title="reportajes" target="_self">Reportajes</a></li><li class="has-submenu"><a href="https://wikamino.github.io/inventarios.html" title="inventarios" target="_self" aria-haspopup="true">Inventarios</a><ul class="navbar__submenu level-2" aria-hidden="true"><li><a href="https://wikamino.github.io/inventarios-aprobados.html" title="inventarios-aprobados" target="_self">Inventarios Aprobados</a></li><li><a href="https://wikamino.github.io/inventarios-wikamino.html" title="inventarios-wikamino" target="_self">Inventarios Wikamino</a></li></ul></li><li><a href="https://wikamino.github.io/enlaces-web.html" title="enlaces-web" target="_self">Enlaces web</a></li></ul></nav></div></header><main class="page page--tags"><div class="hero hero--full"><header class="hero__header"><h1>Tags <sup>(0)</sup></h1><p>Collection of all tags</p></header><figure class="hero__image"><img src="https://wikamino.github.
